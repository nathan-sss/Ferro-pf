note = "theta is an ANGLE IN DEGREES (Haun's convention, R2) -- a DIFFERENT per-deck convention from params/sto_afd_rabeA.toml's linear-displacement meters (theta is per-deck, not global, S28.5 R2/S28.7 R2 both explicit); units.si_to_deck_theta_angle_deg (identity: degrees already O(1-10), unscaled like P) and plain si_to_deck_landau (no extra length-power factor needed in this convention, contrast si_to_deck_theta_landau's meters-mode). EXACT-in-contraction construction (R1): Haun's own [111]-reduced scalar free energy (pIV eq.1-2, Rotated-[111]-frame single-component form) is ΔG_C = 3*alpha1_C*P3^2 + zeta_C*P3^4 + xi_C*P3^6 + 3*beta1_C*theta3^2 + 3*beta11_C*theta3^4 + 3*phi_C*P3^2*theta3^2, phi_C=(gamma11+2*gamma12+gamma44)_C, BARE-PLUS prefix (Haun's own house convention, opposite Chen's minus-prefix that SPEC S28.5 R2 adopted for the STO deck -- both independently net COOPERATIVE for PZT once each sign is tracked through, reports/LIT_haun_tilt.md S6). SIGN-MAPPING DERIVATION (gates/g22f_pzt_haun_quantitative.py step 0 verifies this by sympy from the GENERAL 3-component menu, not asserted): SPEC/afd.py's general f_Ptheta=-t11*sum(Pi^2*thetai^2)-t12*sum_{i!=j}(Pi^2*thetaj^2)-t44*(P1P2th1th2+P2P3th2th3+P3P1th3th1), under P1=P2=P3=P3, theta1=theta2=theta3=theta3 (the SAME [111]-aligned-cubic-axes ansatz as Haun's own reduction -- Part V's own footnote 'Ps=sqrt(3)*P3' confirms Haun's 'P3' is this per-cubic-axis value, not a further-rotated coordinate), collapses to -3*(t11+2*t12+t44)*P3^2*theta3^2 -- matching Haun's 3*phi_C*P3^2*theta3^2 term requires (t11+2*t12+t44) = -phi_C. b1=beta1_C and (b11+b12)=beta11_C are PINNED by Haun (R1); the INDIVIDUAL b11:b12 split and t11:t12:t44 split are NOT resolvable from Haun (Part IV never isolates gamma11/gamma12/gamma44 individually, LIT_haun_tilt.md S6) -- STO-ratio-BORROWED and FLAGGED (params/sto_afd_rabeA.toml's own first-listed SI values, dimensionless ratios only: b11:b12=0.30341:0.69659 of the beta11_C sum; t11:t12:t44=-0.66923:-0.29038:2.25 x the (t11+2t12+t44) contraction -- STO's own quadratic vs quartic OFF-[111] anisotropy magnitude is a physically unrelated material (SrTiO3 vs PZT), this is a structural placeholder for the SPLIT direction only, not a PZT-native number). Elastic/electrostriction OFF (matches Stage 1 R6); Q44(low-T rhombohedral, PZT 90/10 fit)=0.0433 m^4/C^2 and R44=-1.93e-4 deg^-2 (pIV.58, first sourced rotostriction number this WP) PARKED here for a future strain-coupled lane, NOT wired. Records (S28.7 R5): T_R(x=0.2)=+134.7C (pIV eq.8, this composition's own high-T/low-T rhombohedral boundary -- 298K/25C is 109.7K *below* T_R, inside the tilted/low-T-rhombohedral phase by the source's own boundary, replacing Stage 1's qualitative Goldschmidt-tolerance-factor justification). x=0.6@298K R3c question CLOSED as NO: T_R(0.6) per Haun's own eq.8 formula is a deep unphysical extrapolation (~-814C, outside the fit's validity domain) -- params/pzt_Haun_x0.6.toml is nowhere near the tilted-rhombohedral field, do not treat it as an R3c point in any future WP. x=0.3/0.4 RELIABILITY CAUTION (pV.69-72): Part V's own text flags low-T-rhombohedral P (and by the same Q44/R44-frozen-at-90/10 mechanism, theta) as predicted to grow TOO FAST just below T_R for these higher-Ti rows -- x=0.1/0.2 are the more reliable Table II/Table I rows; not used here (x=0.2) but recorded for any future composition choice. EQ.(5) ERRATUM FLAG (pIV.56-57): the coefficient-pinning equation's middle term prints alpha12_C (quartic) inside an otherwise-all-6th-order sum (15*alpha111_C, alpha123_C terms) -- structural consistency would expect alpha112_C; transcribed/used as printed (this deck does not depend on eq.5's own internal consistency, only on its RESULT beta1_C/beta11_C/phi_C, so the flag is provenance-only, not a correction applied here)."
