source = "MODEL-MATERIAL COMPOSITE, SPEC S28.5 R5 -- NOT a literature PZT-tilt deck. P-sector: Rabe/Ahn/Triscone 2007 App A (Chen) p.367 formula set (literature_params.pzt_haun_x_landau_si), x=0.2 (Ti fraction; Zr-rich, 80% Zr), T=100K. theta-sector and (t11,t12,t44) coupling: BORROWED verbatim from params/sto_afd_rabeA.toml's SrTiO3 generator at T=50K (solvers.afd.sto_afd_landau_si), i.e. STO's own AFD self-energy magnitude and Table-3 coupling tensor stand in for PZT's real (unreached) Haun Part IV/V tilt physics. Full justification: reports/WP18_REPORT.md."
