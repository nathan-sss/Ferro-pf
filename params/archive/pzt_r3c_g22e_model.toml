T_pzt_K = 100.0
T_sto_borrow_K = 50.0
label = "PZT Zr-rich R3c science-exit model, G22e (SPEC S28.3/S28.5 R5)"
note = "Composition/T justification (S28.5 R5: 'x=0.6@298K is NOT assumed R3c'): x=0.2 (80% Zr) is far below the x=0.4-0.6 range where the Corker 1998 caveat applies at all, and T=100K is 473.7K below this composition's own T0=573.73K (deep in the ordered ferroelectric phase, not near any Curie-type crossover) -- the general tilts-favored-at-low-T/high-Zr physics (Goldschmidt tolerance-factor argument, Rabe App A intro; Corker et al 1998's own 'tilts increase with increasing Zr content and decreasing T') makes R3c the qualitatively expected regime here even without a precisely known R3m/R3c boundary curve; NOT a claim of a validated quantitative boundary. Coupling sign: this file uses STO's NATIVE (unflipped) Table-3 sign -- gates/g22e found this ALREADY yields P-theta coexistence along [111] in the 0D reduced problem (t44's large positive value dominates t11+2t12+t44 after the [111] tensor contraction, flipping the net effective sign cooperative despite t11/t12 alone being competitive), independently agreeing with Kornev et al. PRL 97,157601(2006)'s first-principles finding of cooperative FE-AFD coupling in real PZT R3c -- a cross-validation of the BORROWED sign choice, not a claim that the MAGNITUDE is validated. Haun Part IV/V numerics remain a REQUIRED placeholder (both OA indexes negative, reports/WP18_STAGE0_NOTE.md); this deck's tilt magnitude carries NO quantitative claim -- G22e's conclusion is STRUCTURAL ONLY (P and theta both nonzero along [111]), never a tilt-angle number. Elastic OFF (S28.5 R6)."
