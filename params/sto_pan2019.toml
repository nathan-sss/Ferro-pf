source = "Pan, Yang, Zhang, Han, Chen, Yang, et al., Science 365, 578 (2019), Supplementary Materials p.3-4 (SM eq S1-S7), via reports/LIT_pan2019_science.md (iii), page-verified pSM.3-4 pdftoppm render"
extracted = "2026-08-28"
T = 298.0
note = "SPEC S34.2 (B2-A). STO end-member of the ternary BiFeO3-BaTiO3-SrTiO3 region-mixture model (dossier iii). alpha1 is T-DEPENDENT (generator function solvers.pan2019_field.sto_alpha1_si(T); deck wrapper sto_landau_deck(T)); the [landau] values below are the T=298K snapshot (declared room-T reference, same convention as bfo_pan2019.toml/bto_pan2019.toml). Units: dossier's own SI values x1e-9 (units.si_to_deck_landau). Independent 0D minimization (gates/g26c_endmember_0d.py) confirms paraelectric ground state (all 3 components ~1e-11..1e-12 deck, i.e. P=0 to numerical precision @ 298K), matching Pan's own STO->paraelectric assignment (alpha1>0 with alpha11>0 and all higher terms zero -- an ordinary convex quartic well at P=0, no independent minimization subtlety)."
stoAlpha1_flag = "SETTLED by B2-D forensics (reports/LIT_pan2019_forensics.md, both sides 300dpi pdftoppm-rendered, not OCR): Rabe App A Table 3 (book p.367/PDF p.378) prints '7.06(T-35.5)'; Pan SM (p.3/PDF p.4) prints 'alpha1=7.06e5(T-36.5)', cited inline to ref (44)=Rabe -- a GENUINE +-1.0K discrepancy in Pan's own transcription of its own cited source (confirmed on both renders, not a rendering artifact); this repo's OWN params/sto_afd_rabeA.toml already carries the Rabe-faithful 35.5 verbatim (coordinator spot-check, SPEC S28.5 R3), so THAT deck is correct relative to Rabe -- Pan's own paper is the outlier. COORDINATOR RULING (2026-08-28, mid-B2-A): main run uses Pan's LITERAL 36.5 (reproduction-fidelity priority -- this deck reproduces what Pan claims to have simulated, not what their cited source actually says); at T=298K the 1K difference changes alpha1 by ~0.4% relative -- not significant, does not move the paraelectric verdict either way."
