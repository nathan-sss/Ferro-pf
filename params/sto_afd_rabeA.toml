[meta]
registry_name = ""   # not a materials.list() entry; read by path -- see `reader`
reader = "octa_tilt.load_sto_deck"   # this file is that reader's own default path
source = "Rabe, Ahn & Triscone (eds.), Physics of Ferroelectrics: A Modern Perspective (Springer, 2007), Appendix A (L.-Q. Chen), Table 3 'Landau-Devonshire coefficients for SrTiO3' (book p.367), citing refs [10]-[15] undifferentiated per-row: Pertsev/Tagantsev/Setter PRB 61,R825(2000)+erratum PRB 65,219901(2002); Uwe & Sakudo PRB 13,271(1976); Tagantsev/Courtens/Arzel PRB 64,224107(2001); Slonczewski & Thomas PRB 1,3599(1970); Bell & Ruprecht Phys.Rev. 129,90(1963). Full provenance: reports/WP18_STAGE0_NOTE.md; checkpoint-1 ruling SPEC S28.5 (coordinator spot-checked this table directly against the local PDF)."
T = 298.0
label = "SrTiO3, pure-theta + coupled-(P,theta) anchor, dual-sector direct transcription (SPEC S28.5 R2)"
note = "P-sector alpha1(T) and theta-sector beta1(T) are BOTH T-dependent closed forms (coth-based); this file is the T=298.0K snapshot only -- solvers/octa_tilt.py's sto_afd_landau_si(T)/sto_afd_landau_deck(T) is the generator gates sweep T with (same generator/frozen-snapshot relationship as pbzo_kittel_lum2022.toml vs kittel_afe.py). theta IS a linear oxygen displacement (meters, Chen's own text), NOT an angle; deck theta uses units.si_to_deck_theta[_landau] (SPEC S28.5 R2): theta expressed in the engine's own existing nm length unit (deck_theta=SI_theta/1e-9), landau-type theta-coefficients carry an extra THETA_LEN_SCALE^theta_power factor on top of the usual x1e-9 energy-density rescaling. f_Ptheta uses Chen's PRINTED MINUS-SIGN-PREFIXED convention (supersedes SPEC S28.1's bare '+'): -t11*sum(Pi^2*thetai^2) - t12*sum_{i!=j}(Pi^2*thetaj^2) - t44*(P1P2theta1theta2+P2P3theta2theta3+P3P1theta3theta1); t11,t12 BOTH negative in Table 3 => net POSITIVE (competitive) same-axis/cross-axis quartic cost under this sign convention -- correct STO physics (AFD tilting suppresses the coincident polar instability), matching SPEC S28.5 R2's own finding. BOOK TYPO ON RECORD (S28.5 R2): Table 3 prints 'N.m^-4' on the beta11 row (copy-pasted from the beta1 row above it); dimensional analysis (beta11 multiplies theta^4 in an energy density, and the beta12 row -- same quartic degree -- correctly prints N.m^-6) requires N.m^-6, used here."
# V2-02.1: deck permittivity unchanged; under the engine's unit system this is eps_b = 10 (legacy label said 1)
eps_b_true = 10.0

