[electrostatics]
# Borrowed BTO's permittivity (bto_298K.toml) for numeric-scale compatibility with the rest of the engine's established deck library -- NOT SrTiO3's own real permittivity (which is anomalously large, ~300 near 298K and diverging further at low T from STO's incipient-ferroelectric character; using that real value here would create a severe scale mismatch against every other deck's depolarization operator). theta does NOT source this field (SPEC S28.1 binding); only P does, and P never orders in real STO anyway (this deck's P-sector is included for dual-sector completeness/G22a's coupling-sign map, not because STO has an accessible P transition).
