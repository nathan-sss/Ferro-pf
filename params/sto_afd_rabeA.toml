[coupling_Ptheta]
# f_Ptheta = -t11*sum(Pi^2*thetai^2) - t12*sum_{i!=j}(Pi^2*thetaj^2) - t44*(P1P2theta1theta2+P2P3theta2theta3+P3P1theta3theta1). Table 3: t11 2 candidates {-1.74e29,-2.10e29} SI (default first), t12 2 candidates {-0.755e29,-0.845e29} SI (default first), t44 SINGLE value 5.85e29 SI. Units confirmed by dimensional analysis (N.C^-2, printed "10^29 C^-2.N"): -t11*P^2*theta^2 is an energy density [N/m^2], P^2*theta^2 is [C^2/m^2] (P in C/m^2, theta in m) => t11 in N/C^2. SI->deck via units.si_to_deck_theta_landau(value, 2) (P contributes no extra factor, unscaled).
