permittivity = 0.8854187

[elastic]
# SOURCED 2026-08-31 (SPEC S37.3/S37.5, B2-E Stage E1): Sluka, Tagantsev,
# Bednyakov & Setter, Nat. Commun. 3, 748 (2012) Table 1 (reports/
# LIT_pan2019_forensics.md's "C/Q mechanical sector" section) -- c11/c12/c44
# = 2.75/1.79/0.543e11 N/m^2, deck-scaled (numerically GPa: 275.0/179.0/54.3)
# -- EXACTLY matches this repo's existing params/bto_BC1984_6th.toml [elastic]
# block (independent cross-check, not re-derived here). Cubic stiffness has
# no Voigt-vs-tensor ambiguity (see bfo_pan2019.toml's own [elastic]
# comment) -- consumed as-is.
c1111 = 275.0
c1122 = 179.0
c1212 = 54.3

[electrostriction]
# SOURCED 2026-08-31 (SPEC S37.3/S37.5 ruling R-c, B2-E Stage E1): Sluka et
# al. 2012 Table 1 (SAME source as [elastic] above) prints Q11=0.1104,
# Q12=-0.0452, Q44=0.0578 in ORDINARY VOIGT/engineering-shear-strain
# notation (eps4=Q44*P2*P3, eps4=2*eps_23 -- the SAME convention this repo's
# elastic.py/materials.py already use for their own Q11_phys/Q12_phys/
# Q44_phys, per bto_BC1984_6th.toml; SPEC S37.5 ruling R-c: this pairing,
# not the legacy decks' Q44=0.029 Rabe-first-candidate mismatch, see
# solvers/bulk3d.py's B2-E R-c sweep note / reports/B2E_E1_REPORT.md for the
# legacy-deck disposition). Recorded here VERBATIM (Sluka's own printed
# numbers, unconverted) -- key names Q11_voigt/Q12_voigt/Q44_voigt name the
# notation explicitly rather than reusing Q11_phys/Q12_phys/Q44_phys, so a
# reader never has to guess which convention a bare "Q44" means (SPEC S37.5's
# named trap). MAPPING into bulk3d.py's internal tensor form (setup_elastic_3d
# Q=(Q1111,Q1122,Q1212)): Q1111_tensor=Q11_voigt, Q1122_tensor=Q12_voigt
# (normal-normal slots, NO factor either notation) but Q1212_tensor=
# Q44_voigt/4=0.01445 (shear-shear slot ONLY -- see solvers/bulk3d.py's
# eigenstrain_3d docstring for the from-scratch derivation of this factor
# of 4). This conversion is applied in CODE (gates/g30a-e, never pre-baked
# into a stored deck number) so the source's own printed digits stay
# traceable here unmodified.
Q11_voigt = 0.1104
Q12_voigt = -0.0452
Q44_voigt = 0.0578
