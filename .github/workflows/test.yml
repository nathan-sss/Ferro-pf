name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ["test", "test,performance"]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[${{ matrix.extra }}]"
      - run: python -m pytest -q tests
      - run: python tools/run_input_table.py --check && python tools/api_index.py --check
      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m fftpf check "$GITHUB_WORKSPACE/docs/run_examples/05_film_relax.toml"
