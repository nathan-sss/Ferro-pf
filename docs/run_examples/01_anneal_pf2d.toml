# Example 1: Langevin anneal of BaTiO3 (298 K) on a small 2D periodic box.
# Illustrative numbers; see docs/RUN_INPUT.md section "Worked examples".
[run]
name = "anneal_pf2d"
seed = 1

[material]
deck = "bto_lcc2005_8th"            # registry name (python -c "from fftpf import mat_registry as m; print(m.list())")
temperature_K = 298.0

[geometry]
engine = "pf2d"
N = [32, 32]
cell_nm = 1.0
slab_thickness_nm = 1.0             # Dz, needed for Langevin noise on pf2d

[physics]
elastic = { k0 = "stress_free" }
noise = { cutoff_nm = 2.0 }         # the default, written out

[numerics]
dt = 0.02                           # fixed; "verified" (the default) would run the dt audit first

[[stage]]
kind = "anneal"
start = "random"
stop = { n_steps = 4000 }
sample_every = 200

[measure]
energy_terms = true

[output]
dir = "auto"
